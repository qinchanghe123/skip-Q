<script>
// *** 配置常量 ***
const RADAR_API_KEY = "prj_live_pk_2e373aa83c20426825149e2299571e9d1ce4d5e9";
const REQUEST_TIMEOUT = 60000;
// Radar Matrix API 限制 25 个目的地
const BATCH_SIZE = 25; 
// 并发请求数限制 (Radar 建议低并发或遵循QPS，这里设为 7 以确保安全不超 5QPS)
const MAX_CONCURRENT = 7;
// 每次请求之间的最小间隔 (毫秒) - 额外的速率保护
const REQUEST_DELAY = 250; 

const HISTORY_KEY = 'search_history_radar';
const MAX_HISTORY = 10;

// --- 历史记录管理 (逻辑保持不变) ---
class SearchHistory {
  constructor() {
    this.history = this.loadHistory();
    this.renderHistory();
  }
  
  loadHistory() {
    try {
      const saved = localStorage.getItem(HISTORY_KEY);
      return saved ? JSON.parse(saved) : [];
    } catch (e) {
      console.warn('历史记录加载失败:', e);
      return [];
    }
  }
  
  saveHistory() {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(this.history));
    } catch (e) {
      console.warn('历史记录保存失败:', e);
    }
  }
  
  addHistory(address) {
    if (!address || !address.trim()) return;
    this.history = this.history.filter(item => item !== address);
    this.history.unshift(address);
    if (this.history.length > MAX_HISTORY) {
      this.history = this.history.slice(0, MAX_HISTORY);
    }
    this.saveHistory();
    this.renderHistory();
  }
  
  removeHistory(address) {
    this.history = this.history.filter(item => item !== address);
    this.saveHistory();
    this.renderHistory();
  }
  
  clearHistory() {
    this.history = [];
    this.saveHistory();
    this.renderHistory();
  }
  
  renderHistory() {
    const historyList = document.getElementById('historyList');
    const clearBtn = document.getElementById('clearHistory');
    
    if (this.history.length === 0) {
      historyList.innerHTML = '<li class="empty-history">暂无查询记录</li>';
      clearBtn.style.display = 'none';
    } else {
      clearBtn.style.display = 'block';
      historyList.innerHTML = this.history.map(address => `
        <li class="history-item" onclick="searchHistory.selectHistory('${address.replace(/'/g, "\\'")}')">
          <div class="history-item-content">
            <span class="history-address" title="${address}">${address}</span>
            <span class="history-delete" onclick="event.stopPropagation(); searchHistory.removeHistory('${address.replace(/'/g, "\\'")}')">✕</span>
          </div>
        </li>
      `).join('');
    }
  }
  
  selectHistory(address) {
    document.getElementById('addressInput').value = address;
    document.getElementById('btnSearch').click();
  }
}

const searchHistory = new SearchHistory();
document.getElementById('clearHistory').onclick = () => {
  if (confirm('确定要清空所有查询历史吗？')) {
    searchHistory.clearHistory();
  }
};

// --- 辅助函数 ---

function formatDuration(seconds) {
    if (seconds < 60) return "少于 1 分钟";
    const hours = Math.floor(seconds / 3600);
    const minutes = Math.floor((seconds % 3600) / 60);
    let parts = [];
    if (hours > 0) parts.push(`${hours} 小时`);
    if (minutes > 0) parts.push(`${minutes} 分钟`);
    return parts.join(' ');
}

function chunkArray(arr, size) {
  const chunks = [];
  for (let i = 0; i < arr.length; i += size) {
    chunks.push(arr.slice(i, i + size));
  }
  return chunks;
}

// 延时函数
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

// --- 核心功能函数 (Radar API 实现) ---

/**
 * 步骤 1: Radar Geocoding
 */
async function geocodeAddress(address) {
    const encodedAddress = encodeURIComponent(address);
    const apiUrl = `https://api.radar.io/v1/geocode/forward?query=${encodedAddress}&country=US`;

    const response = await fetch(apiUrl, {
        method: 'GET',
        headers: {
            'Authorization': RADAR_API_KEY
        }
    });

    if (!response.ok) {
        throw new Error(`地址解析失败: ${response.statusText}`);
    }

    const data = await response.json();
    if (!data.addresses || data.addresses.length === 0) {
        throw new Error("找不到该地址，请检查拼写或尝试更详细的地址。");
    }

    const item = data.addresses[0];
    
    // 确保有 State 信息
    if (!item.state) {
        throw new Error("未能识别地址所在的州 (State)，无法继续。");
    }

    return {
        lat: item.latitude,
        lng: item.longitude,
        state: item.state, // e.g. "Alabama"
        formattedAddress: item.formattedAddress
    };
}

/**
 * 步骤 2: 加载 skipCities.json
 */
async function getCitiesInState(stateName) {
  try {
    const resp = await fetch('skipCities.json');
    if (!resp.ok) throw new Error('城市数据加载失败');
    const data = await resp.json();
    
    // 在数据中查找匹配的州 (不区分大小写)
    const stateData = Object.values(data).find(
        s => s.state_name && s.state_name.toLowerCase() === stateName.toLowerCase()
    );

    if (!stateData || !stateData.cities) {
        throw new Error(`暂不支持 "${stateName}" 州的定点查询。`);
    }

    // 转换为数组格式: [{name: "City", lat: 1.0, lng: 1.0}, ...]
    const citiesArray = Object.keys(stateData.cities).map(cityName => ({
        name: cityName,
        lat: stateData.cities[cityName].lat,
        lng: stateData.cities[cityName].lng
    }));

    return citiesArray;
  } catch (e) {
    throw new Error(e.message || '加载城市数据失败');
  }
}

/**
 * 步骤 3: Radar Matrix 批量计算
 */
async function getDistancesForCityBatch(origin, cityChunk) {
    // Radar Matrix 参数构建
    // origins: lat,lng
    // destinations: lat,lng|lat,lng...
    const originStr = `${origin.lat},${origin.lng}`;
    const destStr = cityChunk.map(c => `${c.lat},${c.lng}`).join('|');
    
    const params = new URLSearchParams({
        origins: originStr,
        destinations: destStr,
        mode: 'car',
        units: 'metric'
    });

    const apiUrl = `https://api.radar.io/v1/route/matrix?${params.toString()}`;

    try {
        const response = await fetch(apiUrl, {
            headers: { 'Authorization': RADAR_API_KEY }
        });

        if (!response.ok) {
            // 如果出错，标记整个块为失败
            return cityChunk.map(c => ({
                city: c.name,
                distance: "查询失败",
                duration: "N/A",
                distanceVal: Infinity,
                error: 'api_error'
            }));
        }

        const data = await response.json();
        // Radar 返回 data.matrix[0] 对应第一个起点的结果数组
        const routeResults = data.matrix ? data.matrix[0] : [];

        return cityChunk.map((cityObj, index) => {
            const route = routeResults[index];
            if (route) {
                // Radar 返回: distance.value (meters), duration.value (minutes)
                const distMeters = route.distance ? route.distance.value : 0;
                const durMinutes = route.duration ? route.duration.value : 0;
                
                // 转换为显示格式
                // 距离转 km 或 miles (这里用 km, 原UI distance.text 是 API 返回的文本)
                // Radar distance.text 如 "12 km"
                const distText = route.distance ? route.distance.text : `${Math.round(distMeters/1000)} km`;
                const durText = formatDuration(durMinutes * 60);

                return {
                    city: cityObj.name,
                    distance: distText,
                    duration: durText,
                    distanceVal: distMeters,
                    error: null
                };
            } else {
                return {
                    city: cityObj.name,
                    distance: "无路径",
                    duration: "N/A",
                    distanceVal: Infinity,
                    error: 'no_route'
                };
            }
        });

    } catch (e) {
        console.error(e);
        return cityChunk.map(c => ({
            city: c.name,
            distance: "异常",
            duration: "N/A",
            distanceVal: Infinity,
            error: 'exception'
        }));
    }
}

// 并发控制池 (支持 1s 5次请求限制)
async function concurrentPool(tasks, poolLimit, onProgress) {
  let i = 0, results = [], active = 0;
  
  return new Promise((resolve) => {
    async function next() {
      // 循环启动任务，直到达到并发限制或没有更多任务
      while (active < poolLimit && i < tasks.length) {
        active++;
        const current = i++;
        
        // 速率限制保护: 每次启动任务前稍微等待
        await sleep(REQUEST_DELAY);

        tasks[current]().then(res => {
          results[current] = res;
        }).catch(err => {
          results[current] = []; // 即使失败也返回空数组防止崩坏
        }).finally(() => {
          active--;
          onProgress?.(results.filter(x => x).length, tasks.length); // 更新进度
          
          if (results.filter(x => x !== undefined).length === tasks.length) {
            resolve(results);
          } else {
            next();
          }
        });
      }
    }
    next();
  });
}

const progressText = document.getElementById('progressText');

btn.onclick = async function() {
  // 重置 UI
  errorEl.textContent = '';
  errorEl.style.display = 'none';
  resultsEl.innerHTML = '';
  loadingEl.style.display = 'block';
  progressContainer.style.display = 'none';
  
  try {
    const input = document.getElementById('addressInput').value.trim();
    if (!input) throw new Error("请输入详细地址");

    searchHistory.addHistory(input);

    // 1. Geocoding
    const origin = await geocodeAddress(input);
    console.log("Origin:", origin);

    // 2. Load Cities
    const cities = await getCitiesInState(origin.state);
    
    // 3. Prepare Batches
    const cityChunks = chunkArray(cities, BATCH_SIZE);
    
    const tasks = cityChunks.map(chunk => 
      () => getDistancesForCityBatch(origin, chunk)
    );

    progressContainer.style.display = 'block';
    progressText.textContent = `准备计算 ${cities.length} 个目标城市 (分 ${cityChunks.length} 批次)...`;
    
    // 4. Execute with Rate Limiting
    const resultsFromPool = await concurrentPool(
      tasks,
      MAX_CONCURRENT,
      (finished, total) => {
        const percent = Math.round((finished / total) * 100);
        progressBar.style.width = percent + "%";
        progressText.textContent = `计算中... 已完成 ${finished} / ${total} 批次 (${percent}%)`;
      }
    );

    // 5. Render
    const allResults = resultsFromPool.flat();
    allResults.sort((a, b) => a.distanceVal - b.distanceVal);

    let html = `<table>
      <thead>
        <tr>
          <th>城市名称</th><th>距离</th><th>驾车时间</th><th>操作</th>
        </tr>
      </thead>
      <tbody>
      ${allResults.map(r => `
        <tr>
          <td><strong>${r.city}</strong></td>
          <td>${r.distance}</td>
          <td>${r.duration}</td>
          <td>
            <a class="nav-link" href="https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(input)}&destination=${encodeURIComponent(r.city + ', ' + origin.state)}" target="_blank">📍 导航</a>
          </td>
        </tr>
      `).join('')}
      </tbody>
    </table>`;

    const errorCount = allResults.filter(r => r.error).length;
    if (errorCount > 0) {
      html += `<div class="quota-warning">
        <strong>⚠️ 注意：</strong>有 ${errorCount} 个城市的数据获取失败。可能是网络问题或地址无法到达。
      </div>`;
    }

    resultsEl.innerHTML = html;
    progressText.textContent = `✅ 查询完成！`;

  } catch (e) {
    errorEl.textContent = `❌ ${e.message}`;
    errorEl.style.display = 'block';
  } finally {
    loadingEl.style.display = 'none';
    setTimeout(() => {
      // 2秒后隐藏进度条，保持页面整洁
      // progressContainer.style.display = 'none'; 
    }, 2000);
  }
};

// 回车键支持
document.getElementById('addressInput').addEventListener('keypress', (event) => {
  if (event.key === 'Enter') {
    btn.click();
  }
});
</script>
</body>
</html>
